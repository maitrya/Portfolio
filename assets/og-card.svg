<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8842c" stop-opacity="0"/>
      <stop offset="15%" stop-color="#a8842c" stop-opacity="1"/>
      <stop offset="85%" stop-color="#a8842c" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a8842c" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Subtle border -->
  <rect x="40" y="40" width="1120" height="550" rx="4" ry="4" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Gold accent initial "M" — large, faded in background -->
  <text x="600" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="420" font-weight="bold" fill="#a8842c" opacity="0.06" text-anchor="middle" dominant-baseline="central">M</text>

  <!-- Gold horizontal line -->
  <rect x="200" y="295" width="800" height="1.5" fill="url(#gold-line)"/>

  <!-- Name -->
  <text x="600" y="260" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">Maitrya Anupam</text>

  <!-- Subtitle -->
  <text x="600" y="345" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#888888" text-anchor="middle" letter-spacing="3">Investment Analyst &amp; Systems Builder</text>

  <!-- Small gold diamond separator -->
  <g transform="translate(600, 400)">
    <rect x="-4" y="-4" width="8" height="8" fill="#a8842c" opacity="0.5" transform="rotate(45)"/>
  </g>

  <!-- Location -->
  <text x="600" y="445" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#555555" text-anchor="middle" letter-spacing="4">SYDNEY, AU</text>
</svg>
