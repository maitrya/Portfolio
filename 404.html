<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 &mdash; Maitrya Anupam</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-size='62' font-family='Georgia,serif' font-weight='500' fill='%23fafaf7' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', serif;
      background: #0a0a0a;
      color: #f3efe5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 420px; }
    .code {
      font-size: 96px;
      font-weight: 500;
      letter-spacing: -0.03em;
      color: #a8842c;
      line-height: 1;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 400;
      font-style: italic;
      margin-bottom: 12px;
      color: #f3efe5;
    }
    p {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      color: #7a766c;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    a {
      display: inline-block;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      color: #0a0a0a;
      background: #f3efe5;
      padding: 11px 24px;
      border-radius: 999px;
      text-decoration: none;
      transition: background .15s ease;
    }
    a:hover { background: #a8842c; color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page not found.</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to portfolio</a>
  </div>
</body>
</html>
